# Controllo automatico a ogni push/pull request: typecheck, smoke test e build.
# Non produce l'installer (quello lo fa release.yml sui tag): serve solo a
# scoprire subito se una modifica rompe qualcosa.
name: controlli

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Smoke test (modulo nativo con ABI Node)
        run: |
          npm rebuild better-sqlite3-multiple-ciphers
          npm run smoke
      - name: Build
        run: npm run build
